<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Gravitas — an N-body gravity sandbox</title>
  <meta name="description" content="Fling planets, collide galaxies and watch the three-body problem dance. A zero-dependency N-body gravity sandbox in the browser." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='5' fill='%23f2b45a'/%3E%3Cellipse cx='16' cy='16' rx='14' ry='6' fill='none' stroke='%23e8e4da' stroke-width='1.6' transform='rotate(-24 16 16)'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&f[]=jet-brains-mono@400,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <canvas id="sky" aria-label="Gravity simulation canvas. Click and drag to launch a body."></canvas>

  <header class="brand">
    <svg class="logo" viewBox="0 0 40 40" fill="none" aria-label="Gravitas logo" role="img">
      <circle cx="20" cy="20" r="6" fill="var(--accent)" />
      <ellipse cx="20" cy="20" rx="17" ry="7.5" stroke="currentColor" stroke-width="1.6" transform="rotate(-24 20 20)" />
      <circle cx="35.2" cy="13.4" r="2.2" fill="currentColor" />
    </svg>
    <div>
      <h1>Gravitas</h1>
      <p>N-body gravity sandbox</p>
    </div>
  </header>

  <aside class="panel" id="panel">
    <section>
      <h2>Scenarios</h2>
      <div class="presets" id="presets"></div>
    </section>

    <section>
      <h2>New body</h2>
      <label class="row">
        <span>Mass</span>
        <input type="range" id="mass" min="0" max="100" value="22" />
        <output id="massOut">10</output>
      </label>
      <label class="row check">
        <input type="checkbox" id="anchor" />
        <span>Pinned in place</span>
      </label>
    </section>

    <section>
      <h2>Simulation</h2>
      <label class="row">
        <span>Speed</span>
        <input type="range" id="speed" min="1" max="40" value="10" />
        <output id="speedOut">1.0×</output>
      </label>
      <label class="row check"><input type="checkbox" id="trails" checked /><span>Trails</span></label>
      <label class="row check"><input type="checkbox" id="merge" checked /><span>Merge on collision</span></label>
      <label class="row check"><input type="checkbox" id="predict" checked /><span>Predict trajectory</span></label>
      <div class="buttons">
        <button id="play" class="primary" aria-keyshortcuts="Space">Pause</button>
        <button id="step" aria-keyshortcuts="S">Step</button>
        <button id="clear" aria-keyshortcuts="C">Clear</button>
        <button id="recenter" aria-keyshortcuts="F">Recenter</button>
      </div>
    </section>

    <section class="stats" aria-live="off">
      <div><span>Bodies</span><b id="statBodies">0</b></div>
      <div><span>Time</span><b id="statTime">0</b></div>
      <div><span>Energy drift</span><b id="statEnergy">0%</b></div>
      <div><span>FPS</span><b id="statFps">0</b></div>
    </section>

    <details class="help">
      <summary>Controls</summary>
      <ul>
        <li><kbd>Drag</kbd> launch a body — pull back like a slingshot</li>
        <li><kbd>Right-drag</kbd> or <kbd>Shift</kbd>+drag pan</li>
        <li><kbd>Wheel</kbd> / pinch zoom</li>
        <li><kbd>Space</kbd> pause · <kbd>S</kbd> step · <kbd>C</kbd> clear</li>
        <li><kbd>T</kbd> trails · <kbd>F</kbd> recenter · <kbd>1</kbd>–<kbd>6</kbd> scenarios</li>
      </ul>
    </details>
  </aside>

  <button class="panel-toggle" id="panelToggle" aria-controls="panel" aria-expanded="true">Hide panel</button>
  <div class="toast" id="toast" role="status"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
